<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NH 프로토타입(앱 400×780)</title>
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<!-- 프로토타입 도구줄(디자인 바깥 영역) -->
<div id="chrome">
  <div class="ttl">앱 프로토타입 <small>400×780 · <span id="curName"></span></small></div>
  <div id="legend" style="display:none;gap:10px;font-size:11px;color:#555;align-items:center">
    <span><i style="display:inline-block;width:12px;height:12px;border:2px solid #17a34a;vertical-align:-2px"></i> Figma 연결</span>
    <span><i style="display:inline-block;width:12px;height:12px;border:2px dashed #f08c00;vertical-align:-2px"></i> Figma에 없는 보완 연결</span>
    <span><i style="display:inline-block;width:12px;height:12px;border:2px dotted #e03131;vertical-align:-2px"></i> 연결 화면 없음</span>
  </div>
  <button class="tool" id="btnFlows" title="플로우 바로가기 목록을 열고 닫습니다">☰<span class="lbl"> 플로우</span></button>
  <button class="tool" id="btnLinks" title="클릭 가능한 연결을 표시합니다">연결 표시</button>
  <a class="tool" href="../index.html" title="버전 선택">버전 선택</a>
  <button class="tool" id="btnStart" title="언제든 시작 화면으로 돌아갑니다">⌂<span class="lbl"> 시작 화면으로</span></button>
</div>
<aside id="flows" aria-label="플로우 바로가기">
  <div class="fh">Flows<button id="flowClose" type="button" aria-label="닫기">✕</button></div>
  <div id="flowList"></div>
  <div class="ff">Figma 프로토타입의 시작점과 같습니다. 누르면 해당 흐름의 첫 화면으로 이동합니다.</div>
</aside>
<div id="wrap"><div id="scaler">
  <main id="device">
    <div id="stage"></div>
    <div id="overlay"></div>
    <div id="toast"></div>
    <div id="loading"></div>
  </main>
</div></div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/screens-auth.js"></script>
<script src="js/screens-transfer.js"></script>
<script src="js/screens-home.js"></script>
<script src="js/screens-menu.js"></script>
<script src="js/screens-mall.js"></script>
<script src="js/screens-resv.js"></script>
<script src="js/screens-mydata.js"></script>
<script src="js/screens-etc.js"></script>
</body>
</html>
